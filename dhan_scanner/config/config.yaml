# dhan_scanner/config/config.yaml

# Core scanner settings
scanner:
  scan_interval_minutes: 5
  strikes_to_check: 2  # ATM +/- this many strikes
  concurrency: 4       # Number of parallel requests to Dhan API

# Signal logic
signal:
  # Tiered thresholds for OI Unwinding (Long/Short signals).
  # The scanner will check for signals at each of these percentage points.
  # The list should be in descending order.
  unwinding_thresholds: [30, 20, 10]

  # Tiered thresholds for the new OI Buildup signals.
  buildup_thresholds: [30, 20, 10]

# Liquidity filters
liquidity:
  # Exclude strikes where (ask - bid) / ((ask + bid) / 2) > max_spread_percentage
  max_spread_percentage: 15.0
  min_option_volume: 100
  min_open_interest: 1000

# Strike selection rules (defaults)
strike_selection:
  # For indices like NIFTY, BANKNIFTY
  index_step: 50
  # For individual stocks based on LTP. More steps added for high-value stocks.
  stock_steps:
    - { max_ltp: 100, step: 1 }
    - { max_ltp: 500, step: 5 }
    - { max_ltp: 1000, step: 10 }
    - { max_ltp: 2500, step: 25 }
    - { max_ltp: 5000, step: 50 }
    - { max_ltp: 100000, step: 100 } # A large number for "everything else"

# API robustness
api:
  max_retries: 3
  backoff_factor: 0.5 # In seconds

# Logging configuration
logging:
  log_file: "dhan_scanner/logs/scanner.log"
  max_file_size_mb: 10
  backup_count: 7
  level: "INFO"